data:
  train_jsonl: data/processed/unconditional/train.jsonl
  val_jsonl: data/processed/unconditional/val.jsonl
  smiles_field: smiles
  max_seq_len: 320

  randomize_train_smiles: true
  randomize_train_probability: 1.0
  randomize_train_max_attempts: 10

tokenizer:
  path: artifacts/tokenizer_pretrain/tokenizer.json

model:
  # No init_checkpoint: baseline is initialized from scratch.

  max_seq_len: 320
  n_layers: 8
  d_model: 512
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.05
  bias: true

train:
  seed: 101

  output_dir: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/baseline/seed_101

  epochs: 80

  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1

  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0

  warmup_ratio: 0.05
  lr_scheduler_type: cosine

  logging_steps: 20

  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit:

  fp16: false
  bf16: true

  report_to: wandb

  generation_monitor:
    enabled: true
    every_n_epochs: 1

    num_samples: 500
    batch_size: 32

    max_new_tokens:

    temperature: 1.0
    top_k:
    top_p: 0.9

    reference_jsonls:
      - data/processed/unconditional/train.jsonl

    reference_smiles_field: smiles

    fp_radius: 2
    fp_n_bits: 2048
    max_diversity_samples: 1000

    log_molecule_images_to_wandb: true
    num_valid_molecules_to_visualize: 10
    mols_per_row: 5
    sub_img_size: [300, 300]

    save_monitor_metrics_locally: true