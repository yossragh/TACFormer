tokenizer:
  path: artifacts/tokenizer_pretrain/tokenizer.json

model:
  path: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/conditional/seed_100/checkpoint-32120

conditioning:
  poi_embeddings_path: data/processed/poi_embeddings.pt

generation:
  output_path: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/conditional/seed_100/raw_samples.jsonl

  seed: 42
  device: cuda

  # 20 POIs × 2000 molecules per POI = 40,000 total molecules.
  num_samples: 200000
  batch_size: 32

  # If blank/null, generate.py uses model.config.max_seq_len - 1.
  # For max_seq_len=512, this becomes 511.
  max_new_tokens:

  # Keep the same sampling settings used during training monitoring.
  temperature: 1.0

  # Blank disables top-k filtering.
  top_k:

  top_p: 0.9

  # The same 20 POIs used during conditional monitoring.
  # UniProt is used here because poi_embeddings.pt is keyed by UniProt ID.
  target_uniprots:
    - P10275  # AR
    - P03372  # ESR1
    - P11802  # CDK4
    - P01116  # KRAS
    - Q15910  # EZH2
    - Q06187  # BTK
    - O60885  # BRD4
    - P15056  # BRAF
    - P51532  # SMARCA4
    - Q92918  # MAP4K1
    - Q9NWZ3  # IRAK4
    - P00533  # EGFR
    - Q07817  # BCL2L1
    - P51531  # SMARCA2
    - Q9HCE5  # METTL14
    - P18031  # PTPN1
    - P10415  # BCL2
    - Q07889  # SOS1
    - P41182  # BCL6
    - P10636  # MAPT