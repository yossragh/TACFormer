evaluation:
  generated_jsonl: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/pretrain/seed_11/evaluation/raw_samples.jsonl

  # IMPORTANT:
  # Use the exact train.jsonl that was used to train the pretrained prior.
  reference_train_jsonl: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/dapt_merged/train_dapt.jsonl

  output_dir: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/pretrain/seed_11/evaluation

  generated_smiles_field: raw_smiles
  reference_smiles_field: smiles

  seed: 42
  suppress_rdkit_warnings: true

  fp_radius: 2
  fp_n_bits: 2048

  # Internal diversity is estimated using at most this many
  # unique valid generated molecules.
  max_diversity_samples: 1000

  max_invalid_examples: 50

  # This is an unconditional prior, so do not run
  # POI-specific conditional-fidelity evaluation.
  conditional_fidelity:
    enabled: false