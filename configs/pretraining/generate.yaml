tokenizer:
  path: artifacts/tokenizer_pretrain/tokenizer.json

model:
  path: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/pretrain/seed_11/checkpoint-58950

generation:
  output_path: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/pretrain/seed_11/evaluation/raw_samples.jsonl

  seed: 42
  device: cuda

  # Unconditional generation: 20,000 molecules total.
  num_samples: 20000
  batch_size: 32

  # Leave null so generate.py uses:
  # model.config.max_seq_len - 1
  max_new_tokens:

  # Same sampling setup used for the other generation experiments.
  temperature: 1.0

  # Null disables top-k filtering.
  top_k:

  top_p: 0.9