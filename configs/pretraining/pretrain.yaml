tokenizer:
  path: artifacts/tokenizer_pretrain/tokenizer.json

data:
  train_jsonl: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/dapt_merged/train_dapt.jsonl
  val_jsonl: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/dapt_merged/val_dapt.jsonl
  smiles_field: smiles
  max_seq_len: 320

  # On-the-fly randomized SMILES augmentation for training only.
  # Validation remains fixed/canonical in scripts/train.py.
  randomize_train_smiles: true
  randomize_train_probability: 1.0
  randomize_train_max_attempts: 10

model:
  max_seq_len: 320
  n_layers: 8
  d_model: 512
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.05
  bias: true

train:
  seed: 46
  run_name: pretrain_seed_46

  output_dir: /nobackup/proj/disk/naiss2024-5-630/personal/yossra/TACFormer/pretrain/seed_46

  epochs: 70

  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1

  learning_rate: 2.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine

  logging_steps: 50

  save_strategy: epoch
  eval_strategy: epoch

  save_total_limit: 
  load_best_model_at_end: false
  metric_for_best_model: eval_loss
  greater_is_better: false

  fp16: false
  bf16: true

  report_to: wandb

  generation_monitor:
    enabled: true
    every_n_epochs: 1

    num_samples: 500
    batch_size: 32
    max_new_tokens: null

    temperature: 1.0
    top_k: null
    top_p: 0.9

    reference_jsonls:
      - /nobackup/proj/disk/naiss2024-5-630/personal/yossra/dapt_merged/train_dapt.jsonl
    reference_smiles_field: smiles

    fp_radius: 2
    fp_n_bits: 2048
    max_diversity_samples: 500

    log_molecule_images_to_wandb: true
    num_valid_molecules_to_visualize: 10
    mols_per_row: 5
    sub_img_size: [300, 300]
    

    save_monitor_metrics_locally: true